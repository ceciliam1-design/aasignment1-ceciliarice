<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact | Cecilia Rice Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Get in Touch</h1>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Me</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
</header>

<main>
    <div class="content"> 
        <section>
            <h2>My Contacts</h2>
            <p>
                I am available through email: <strong>cecilia.rice@msj.edu</strong> or you can follow my photography account on Instagram <strong>@cecis.snapshots</strong>.
            </p>
        </section>

        <section>
            <h3>Send a Message</h3>
            <form id="contact-form">
                <div class="form-group">
                    <label for="user-name">Name:</label>
                    <input type="text" id="user-name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="user-email">Email:</label>
                    <input type="email" id="user-email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn-submit">Send Message</button>
            </form>
            <p id="form-status"></p>
        </section>
        
        <button id="toggle-mode">Switch to Low Exposure</button>
    </div>
</main>

<script src="script.js"></script>
</body>
</html>
